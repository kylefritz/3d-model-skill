# The parameters. build.py turns this into site/controls.json, the one contract the
# generator and the viewer both read. Three kinds of parameter:
#
#   color  - recolors named materials in the browser. Free: no new geometry.
#   swap   - picks a pre-built GLB. Geometry that changes shape (cladding, a door
#            that needs a different opening) is built once per value at build time.
#   range  - moves a named node in the browser (a sliding panel), by a distance
#            the generator wrote into the contract.
#
# Paint chips are Sherwin-Williams colors; hex values are SW's own published RGB.
# A screen is not a paint chip: get a real sample before you buy a gallon.

paints:
  sw7005: {name: SW 7005 Pure White, hex: "#EDECE6"}
  sw6204: {name: SW 6204 Sea Salt, hex: "#CDD2CA"}
  sw7036: {name: SW 7036 Accessible Beige, hex: "#D1C7B8"}
  sw6187: {name: SW 6187 Rosemary, hex: "#64695C"}
  sw6244: {name: SW 6244 Naval, hex: "#2F3D4C"}
  sw2802: {name: SW 2802 Rookwood Red, hex: "#622F2D"}
  sw7069: {name: SW 7069 Iron Ore, hex: "#434341"}
  sw6258: {name: SW 6258 Tricorn Black, hex: "#2F2F30"}
  haint:  {name: Haint blue, hex: "#ACC8D2"}

natural_brick: "#8C4A36"

sections:
  - name: Cladding
    fields:
      - id: cladding
        kind: swap
        label: Cladding
        default: brick
        options:
          brick: {label: Brick, note: "Face brick, 2 1/4\" courses, 3 per 8\"."}
          lap: {label: Lap siding, note: "Fiber cement lap, 8 1/4\" board at 7\" exposure."}
          batten: {label: Board & batten, note: "Smooth panel with 2 1/2\" battens at 16\" on center."}
          shingle: {label: Cedar shingles, note: "16\" shingles at 5\" exposure."}
      - id: paint_brick
        kind: toggle
        label: Paint the brick
        default: false
        when: {cladding: brick}

  - name: Exterior paint
    fields:
      - id: body
        kind: color
        label: Body
        default: sw6244
        palette: [sw7005, sw6204, sw7036, sw6187, sw6244, sw2802, sw7069, sw6258]
        materials: [paint.body]
      - id: trim
        kind: color
        label: Trim & windows
        default: sw7005
        palette: [sw7005, sw6204, sw7036, sw7069, sw6258]
        materials: [paint.trim, window.frame]

  - name: Front porch
    fields:
      - id: porch_floor
        kind: color
        label: Floor & treads
        default: sw7069
        palette: [sw7069, sw6187, sw6244, sw2802, sw7036, sw6258]
        materials: [porch.floor]
      - id: porch_trim
        kind: color
        label: Posts & rails
        default: sw7005
        palette: [sw7005, sw6204, sw7036, sw6187, sw6258]
        materials: [porch.trim]
      - id: porch_ceiling
        kind: color
        label: Ceiling
        default: haint
        palette: [haint, sw7005, sw6204]
        materials: [porch.ceiling]
      - id: front_door
        kind: color
        label: Front door
        default: sw2802
        palette: [sw2802, sw6244, sw6187, sw6258, sw7005]
        materials: [door.front]

  - name: Rear door
    fields:
      - id: door
        kind: swap
        label: Sliding door
        default: andersen200
        products: model/doors.yaml     # options come from the product sheet
      - id: door_color
        kind: color
        label: Door frame
        options_by: door               # each product has its own real color list
        materials: [door.frame]
      - id: door_open
        kind: range
        label: Open
        default: 35
        min: 0
        max: 100
        unit: "%"
        node: door.operable

# Which GLB each slot shows. A slot whose file depends on two parameters is built as
# their cross product: the rear wall's opening depends on the door, its skin on the
# cladding, so there are doors x claddings rear-wall files. Keep those products small.
slots:
  cladding: "options/cladding-{cladding}.glb"
  rear: "options/rear-{door}-{cladding}.glb"
  door: "options/door-{door}.glb"

# Natural brick ignores the body paint; everything else takes it.
brick_color: {paint_toggle: paint_brick, paint_field: body}

# Viewpoints, in model inches (X along the facade, Y back toward the yard, Z up).
views:
  - {name: Street, eye: [150, -560, 70], target: [96, 0, 110]}
  - {name: Front porch, eye: [170, -150, 40], target: [40, -30, 50]}
  - {name: Back yard, eye: [40, 960, 90], target: [126, 552, 60]}
  - {name: Rear door, eye: [126, 690, 64], target: [126, 552, 46]}
  - {name: Inside, eye: [126, 430, 64], target: [126, 560, 44]}
