# The parameters. build.py turns this into site/controls.json, the one contract the
# generator and the viewer both read. Three kinds of parameter:
#
#   color  - recolors named materials in the browser. Free: no new geometry.
#   swap   - picks a pre-built GLB. Geometry that changes shape (cladding, a door
#            that needs a different opening) is built once per value at build time.
#   range  - moves a named node in the browser (a sliding panel), by a distance
#            the generator wrote into the contract.
#   steps  - a slider over a few values that change shape (porch depth, roof pitch,
#            guard height). Each step is a pre-built GLB, like a swap, so the
#            drawings and cut list can be drawn for the same step.
#
# Paint chips are Sherwin-Williams colors; hex values are SW's own published RGB.
# A screen is not a paint chip: get a real sample before you buy a gallon.

paints:
  sw7005: {name: SW 7005 Pure White, hex: "#EDECE6"}
  sw6204: {name: SW 6204 Sea Salt, hex: "#CDD2CA"}
  sw7036: {name: SW 7036 Accessible Beige, hex: "#D1C7B8"}
  sw6187: {name: SW 6187 Rosemary, hex: "#64695C"}
  sw6244: {name: SW 6244 Naval, hex: "#2F3D4C"}
  sw2802: {name: SW 2802 Rookwood Red, hex: "#622F2D"}
  sw7069: {name: SW 7069 Iron Ore, hex: "#434341"}
  sw6258: {name: SW 6258 Tricorn Black, hex: "#2F2F30"}
  haint:  {name: Haint blue, hex: "#ACC8D2"}

natural_brick: "#8C4A36"

sections:
  - name: Cladding
    fields:
      - id: cladding
        kind: swap
        label: Cladding
        default: brick
        options:
          brick: {label: Brick, note: "Face brick, 2 1/4\" courses, 3 per 8\"."}
          lap: {label: Lap siding, note: "Fiber cement lap, 8 1/4\" board at 7\" exposure."}
          batten: {label: Board & batten, note: "Smooth panel with 2 1/2\" battens at 16\" on center."}
          shingle: {label: Cedar shingles, note: "16\" shingles at 5\" exposure."}
      - id: paint_brick
        kind: toggle
        label: Paint the brick
        default: false
        when: {cladding: brick}

  - name: Exterior paint
    fields:
      - id: body
        kind: color
        label: Body
        default: sw6244
        palette: [sw7005, sw6204, sw7036, sw6187, sw6244, sw2802, sw7069, sw6258]
        materials: [paint.body]
      - id: trim
        kind: color
        label: Trim & windows
        default: sw7005
        palette: [sw7005, sw6204, sw7036, sw7069, sw6258]
        materials: [paint.trim, window.frame]

  - name: Front porch
    drawings: "drawings/porch-{rail_height}-{porch_depth}/"
    fields:
      - id: porch_floor
        kind: color
        label: Floor & treads
        default: sw7069
        palette: [sw7069, sw6187, sw6244, sw2802, sw7036, sw6258]
        materials: [porch.floor]
      - id: porch_trim
        kind: color
        label: Posts & rails
        default: sw7005
        palette: [sw7005, sw6204, sw7036, sw6187, sw6258]
        materials: [porch.trim]
      - id: porch_ceiling
        kind: color
        label: Ceiling
        default: haint
        palette: [haint, sw7005, sw6204]
        materials: [porch.ceiling]
      - id: porch_depth
        kind: steps
        label: Porch depth
        default: "8"
        values: [6, 7, 8]
        unit: "'"
        note: Changes the posts, the side guards and the stair landing; the sidewalk stays put.
      - id: porch_pitch
        kind: steps
        label: Roof pitch
        default: "2"
        values: [1, 2, 3, 4]
        unit: " in 12"
        note: Low-slope metal wants at least 1/2 in 12; standing seam is happy from 3 in 12.
      - id: rail_height
        kind: steps
        label: Guard height
        default: "36"
        values: [36, 38, 40, 42]
        unit: '"'
        note: 36" is the residential minimum (IRC R312); 42" is the commercial one.
      - id: front_door
        kind: color
        label: Front door
        default: sw2802
        palette: [sw2802, sw6244, sw6187, sw6258, sw7005]
        materials: [door.front]

  - name: Rear door
    drawings: "drawings/door-{door}/"
    fields:
      - id: door
        kind: swap
        label: Sliding door
        default: andersen200
        products: model/doors.yaml     # options come from the product sheet
      - id: door_color
        kind: color
        label: Door frame
        options_by: door               # each product has its own real color list
        materials: [door.frame]
      - id: door_open
        kind: range
        label: Open
        default: 35
        min: 0
        max: 100
        unit: "%"
        node: door.operable

# Which GLB each slot shows. A slot whose file depends on two parameters is built as
# their cross product: the rear wall's opening depends on the door, its skin on the
# cladding, so there are doors x claddings rear-wall files. Keep those products small.
slots:
  cladding: "options/cladding-{cladding}.glb"
  rear: "options/rear-{door}-{cladding}.glb"
  door: "options/door-{door}.glb"
  porch: "options/porch-{porch_pitch}-{rail_height}-{porch_depth}.glb"

# Natural brick ignores the body paint; everything else takes it.
brick_color: {paint_toggle: paint_brick, paint_field: body}

# The house as measured today. The Existing / Proposed toggle shows these values and
# locks the panel; Proposed is whatever the panel says.
existing:
  cladding: brick
  paint_brick: false
  trim: sw7005
  porch_floor: sw7069
  porch_trim: sw7005
  porch_ceiling: sw7005
  front_door: sw2802
  door: none
  porch_depth: "8"
  porch_pitch: "1"
  rail_height: "36"

# Lights that come on at dusk, in model inches. Watts is a feel, not a fixture spec.
lights:
  - {name: porch ceiling, at: [56, -48, 103], color: "#ffd29a", power: 18}
  - {name: porch ceiling, at: [136, -48, 103], color: "#ffd29a", power: 18}
  - {name: rear sconce, at: [126, 556, 92], color: "#ffc98a", power: 12}
  - {name: kitchen, at: [126, 460, 100], color: "#ffe2b8", power: 30}
  - {name: front room, at: [96, 120, 100], color: "#ffe2b8", power: 30}

# Viewpoints, in model inches (X along the facade, Y back toward the yard, Z up).
views:
  - {name: Street, eye: [150, -560, 70], target: [96, 0, 110]}
  - {name: Front porch, eye: [170, -150, 40], target: [40, -30, 50]}
  - {name: Back yard, eye: [40, 960, 90], target: [126, 552, 60]}
  - {name: Rear door, eye: [126, 690, 64], target: [126, 552, 46]}
  - {name: Inside, eye: [126, 430, 64], target: [126, 560, 44]}
  # plan cuts: `section` is the cut height in inches; the camera looks straight down
  - {name: First floor plan, eye: [96, 270, 1100], target: [96, 272, 0], section: 48}
  - {name: Second floor plan, eye: [96, 270, 1100], target: [96, 272, 120], section: 168}

# Tours: camera keyframes in model inches, at seconds. `set` applies settings at a key
# (a range slider eases between keys). The viewer plays them; tools/record_tour.py
# renders them frame by frame to video. Keep the path out of the walls: check a new
# one with `record_tour.py --every 1` and look at the frames.
tours:
  - name: Front to back
    keys:
      - {at: 0, eye: [150, -560, 70], target: [96, 0, 110], set: {door_open: 0}}
      - {at: 4, eye: [120, -270, 62], target: [80, 0, 70]}
      - {at: 7.5, eye: [160, -170, 58], target: [40, -40, 50]}
      - {at: 11, eye: [-120, -420, 330], target: [96, 150, 150]}
      - {at: 14.5, eye: [-330, 300, 620], target: [96, 330, 140]}
      - {at: 18, eye: [-200, 1080, 260], target: [110, 560, 90]}
      - {at: 20.5, eye: [50, 1010, 110], target: [126, 552, 60]}
      - {at: 23, eye: [143, 720, 64], target: [143, 552, 50], set: {door_open: 0}}
      - {at: 25.5, eye: [143, 620, 64], target: [143, 500, 58], set: {door_open: 100}}
      - {at: 29, eye: [143, 450, 64], target: [120, 150, 62]}
  - name: Porch options
    keys:
      - {at: 0, eye: [260, -300, 170], target: [96, -40, 70], set: {porch_depth: 8, porch_pitch: 1, rail_height: 36}}
      - {at: 3, eye: [180, -340, 164], target: [96, -40, 66], set: {porch_pitch: 2}}
      - {at: 5, eye: [100, -350, 162], target: [96, -40, 66], set: {porch_pitch: 3}}
      - {at: 7, eye: [10, -330, 164], target: [96, -40, 66], set: {porch_pitch: 4, rail_height: 42}}
      - {at: 9.5, eye: [-60, -260, 170], target: [96, -40, 66], set: {porch_depth: 6}}
      - {at: 12, eye: [-40, -180, 180], target: [96, -30, 60], set: {porch_depth: 7, rail_height: 38}}
