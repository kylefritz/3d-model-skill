<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3d-model-skill example house</title>
<meta name="description" content="A parametric 3D rowhouse: change the cladding, paint, porch colors and the rear sliding door.">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<div id="viewport"></div>
<header id="title"><b>3d-model-skill</b><span>example house</span></header>
<div id="compass" role="img" aria-label="Compass"><i>N</i></div>
<aside id="panel" aria-label="Design options">
  <button id="panel-toggle" aria-expanded="false" aria-controls="panel-body">Design</button>
  <div id="panel-body"></div>
</aside>
<nav id="dock" aria-label="Views">
  <button id="prev-view" aria-label="Previous view">‹</button>
  <select id="view" aria-label="Viewpoint"></select>
  <button id="next-view" aria-label="Next view">›</button>
  <button id="walk">Walk</button>
  <select id="tour-pick" aria-label="Which tour"></select>
  <button id="tour">Tour</button>
  <button id="share">Share</button>
  <button id="comment" hidden title="Point at things or draw, and write a note">✎<span> Comment</span></button>
</nav>
<section id="note" hidden aria-label="Comment">
  <div class="note-row"><div id="note-tool" class="seg" role="group" aria-label="Annotate"><button data-tool="point">Point at things</button><button data-tool="pen">Pen</button></div><button id="note-undo" class="plain">Undo</button></div>
  <p id="note-hint" class="note"></p>
  <textarea id="note-body" rows="3" maxlength="4000" placeholder="What should change, or what is this?" aria-label="Note"></textarea>
  <div class="note-row"><input id="note-author" maxlength="60" placeholder="Your name (optional)" autocomplete="name" aria-label="Your name"><input id="note-website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true"><button id="note-cancel" class="plain">Cancel</button><button id="note-send" class="primary">Send</button></div>
  <details id="note-list"><summary>Earlier notes</summary><ol></ol></details>
</section>
<canvas id="ink" aria-hidden="true"></canvas><div id="pins" aria-hidden="true"></div>
<div id="walk-pad" hidden>
  <div id="walk-stick" role="img" aria-label="Walk joystick"><div id="walk-knob"></div></div>
  <div class="walk-keys"><button data-move="forward" aria-label="Forward">↑</button><div><button data-move="left" aria-label="Left">←</button><button data-move="backward" aria-label="Back">↓</button><button data-move="right" aria-label="Right">→</button></div></div>
  <div class="walk-rise"><button data-move="up" aria-label="Rise">▲</button><button data-move="down" aria-label="Drop">▼</button></div>
  <button id="finish-walk">Finish walking</button>
  <small class="walk-hint-keys">Drag to look · WASD or arrows (hold to speed up) · Shift to jog · Q/E down/up · double-click to go there · Esc to finish</small>
  <small class="walk-hint-touch">Left thumb walks, hold to speed up · drag to look · double-tap to go there</small>
</div>
<div id="toast" role="status"></div>
<div id="loading">Loading model…</div>
<script type="module" src="app.js"></script>
</body>
</html>
